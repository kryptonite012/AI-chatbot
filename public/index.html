<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sangam AI</title>
    <meta name="description" content="Ask once and compare answers from ChatGPT, Gemini, Claude, Grok, DeepSeek, Perplexity and local AI models side by side." />
    <meta name="theme-color" content="#09090d" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/theme-init.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Chats">
        <div class="brand">
          <img class="brand-logo" src="/logo.svg" alt="" width="30" height="30" />
          <span class="brand-name" data-app-name>Sangam AI</span>
          <button class="icon-btn sidebar-close" id="sidebarClose" type="button" aria-label="Close sidebar"><span data-icon="x"></span></button>
        </div>

        <button class="new-chat" id="newChat" type="button"><span data-icon="plus"></span>New chat</button>

        <label class="search">
          <span data-icon="search"></span>
          <input id="searchChats" type="search" placeholder="Search chats" autocomplete="off" />
        </label>

        <nav class="history" id="history" aria-label="Chat history"></nav>

        <div class="sidebar-foot">
          <button class="foot-btn" id="openSettings" type="button"><span data-icon="sliders"></span>Settings</button>
          <button class="icon-btn" id="toggleTheme" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
        </div>
      </aside>
      <div class="scrim" id="scrim"></div>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn" id="menuBtn" type="button" aria-label="Toggle sidebar" title="Toggle sidebar"><span data-icon="sidebar"></span></button>
          <h1 class="chat-title" id="chatTitle">New chat</h1>
          <div class="topbar-actions">
            <button class="icon-btn" id="exportChat" type="button" aria-label="Export chat" title="Export chat as Markdown"><span data-icon="download"></span></button>
            <button class="btn ghost" id="manageModels" type="button"><span data-icon="layers"></span><span class="hide-sm">Models</span></button>
          </div>
        </header>

        <section class="columns" id="columns" aria-live="polite">
          <div class="boot"><div class="spinner"></div></div>
        </section>

        <footer class="composer-wrap">
          <div class="suggestions" id="suggestions"></div>
          <div class="model-chips" id="modelChips"></div>
          <form class="composer" id="composer" autocomplete="off">
            <textarea id="prompt" rows="1" placeholder="Ask anything…" aria-label="Your message"></textarea>
            <div class="composer-actions">
              <button class="icon-btn" id="enhanceBtn" type="button" title="Improve my prompt" aria-label="Improve my prompt"><span data-icon="sparkles"></span></button>
              <button class="icon-btn" id="micBtn" type="button" title="Voice input" aria-label="Voice input"><span data-icon="mic"></span></button>
              <button class="send-btn" id="sendBtn" type="submit" aria-label="Send"><span data-icon="send"></span></button>
            </div>
          </form>
          <p class="composer-hint" id="composerHint"></p>
        </footer>
      </main>
    </div>

    <dialog class="modal" id="settingsDialog" aria-labelledby="settingsTitle">
      <div class="modal-card">
        <header class="modal-head">
          <h2 id="settingsTitle">Settings</h2>
          <button class="icon-btn" type="button" data-close aria-label="Close"><span data-icon="x"></span></button>
        </header>
        <nav class="tabs" role="tablist">
          <button class="tab" type="button" role="tab" data-tab="keys">API keys</button>
          <button class="tab" type="button" role="tab" data-tab="models">Models</button>
          <button class="tab" type="button" role="tab" data-tab="general">General</button>
        </nav>
        <div class="modal-body" id="settingsBody"></div>
        <footer class="modal-foot" id="settingsFoot"></footer>
      </div>
    </dialog>

    <dialog class="modal small" id="lockDialog" aria-labelledby="lockTitle">
      <form class="modal-card lock-card" id="lockForm" method="dialog">
        <img class="lock-logo" src="/logo.svg" alt="" width="56" height="56" />
        <h2 id="lockTitle"><span data-app-name>Sangam AI</span> is private</h2>
        <p class="muted">Enter the access password to continue.</p>
        <input id="lockInput" type="password" placeholder="Password" autocomplete="current-password" required />
        <p class="form-error" id="lockError" hidden>Wrong password. Try again.</p>
        <button class="btn primary block" type="submit">Unlock</button>
      </form>
    </dialog>

    <input type="file" id="importFile" accept="application/json,.json" hidden />
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
